name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  check:
    name: Check (typecheck, lint, layers, unit, build, budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (ESLint + layer boundaries via lint:deps)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit, conformance and stress tests
        run: npm run test
      - name: Replay regression (explicit)
        run: npx vitest run tests/unit/replay.test.ts
      - name: Route solver fixtures (every committed solution still reaches its goals)
        run: |
          set -o pipefail
          npm run --silent levels:solve -- --verify | tee solver.txt
      - name: Keep summary inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-inputs
          path: solver.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Production build (embeds build hash)
        run: npm run build
      - name: Bundle size vs budgets.json
        run: npm run bundle:report
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || format('build-{0}', github.sha) }}
          path: dist
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Owner, 2026-10-12: PRs run Chromium only, and pushes to main run all three engines.
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browser and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install system dependencies only (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Playwright
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # One short PR comment an orchestrating agent can read instead of logs (docs/agents/workflow.md).
  summary:
    name: PR summary comment
    needs: [check, e2e]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-summary-inputs
      - uses: actions/github-script@v7
        env:
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- stickgame-ci-summary -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const icon = (r) => ({ success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' })[r] ?? r;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const sensitive = files
              .map((f) => f.filename)
              .filter((f) => /^(\.github\/|package(-lock)?\.json$|AGENTS\.md$|CLAUDE\.md$|scripts\/agents\/|src\/tools\/device-lab\/golden\.ts$|eslint\.config\.js$|\.dependency-cruiser\.cjs$)/.test(f));
            const levels = files.map((f) => f.filename).filter((f) => /^content\/(levels|solutions)\//.test(f));
            let solver = '';
            try {
              solver = fs.readFileSync('solver.txt', 'utf8').split('\n').filter((l) => /^\S+\s+(ok|unsolved|no fixture|FAIL|fail)/i.test(l)).join('\n');
            } catch {}
            const lines = [
              marker,
              `**CI for ${pr.head.sha.slice(0, 7)}**: check ${icon(process.env.CHECK)} · e2e ${icon(process.env.E2E)} · ${files.length} files, +${pr.additions}/−${pr.deletions}`,
            ];
            if (sensitive.length) lines.push(`**Sensitive paths (review closely):** ${sensitive.map((f) => '`' + f + '`').join(', ')}`);
            if (levels.length) lines.push(`**Level content:** ${levels.map((f) => '`' + f + '`').join(', ')}`);
            if (solver) lines.push('<details><summary>Route solver</summary>\n\n```\n' + solver + '\n```\n</details>');
            if (process.env.CHECK !== 'success' || process.env.E2E !== 'success')
              lines.push(`Failing job logs: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`);
            const body = lines.join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });

  preview:
    name: Preview deploy (Cloudflare Pages, optional)
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not configured: hosted preview skipped. Download the preview-${{ github.event.pull_request.number }} artifact instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download build
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stickgame --branch=pr-${{ github.event.pull_request.number }}
      - name: Comment preview URL on PR
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- stickgame-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\nPreview for ${sha}: ${process.env.PREVIEW_URL}\n\nAdd \`?debug\` to show the overlay.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
