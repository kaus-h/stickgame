<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StickSwing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Safe-area insets for the touch controls (GMR-27): read by the app as numbers. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3efe6;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Custom properties are not resolved by getComputedStyle; padding is. */
      #safe-area-probe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-area-probe"></div>
    <script type="module" src="/src/app/web/main.ts"></script>
  </body>
</html>
